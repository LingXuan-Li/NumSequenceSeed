
name: Formatting, Testing and GitHub Pages

run-name: "CI · ${{ github.ref_name }}"

on:
  push:
    branches:
      - "**"

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  formatting:
    name: Format (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      REF_NAME: ${{ github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: npm

      - name: Show Environment
        run: |
          echo "Runner OS: $RUNNER_OS"
          echo "Runner Architecture: $RUNNER_ARCH"
          echo "Node.js:"
          node --version
          echo "npm:"
          npm --version
          echo "Commit: $(git rev-parse HEAD)"

      - name: Install Dependencies
        run: npm ci

      - name: Formatting
        run: npx prettier --write .

      - name: Commit Formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -u

          if git diff --cached --quiet; then
            echo "No formatting changes."
          else
            git commit -m "style[bot]: Automatic formatting"
            git push origin "HEAD:refs/heads/$REF_NAME"
          fi

  testing:
    name: Test and Build (Ubuntu)
    runs-on: ubuntu-latest
    needs: formatting
    timeout-minutes: 15

    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: npm

      - name: Show Environment
        run: |
          echo "Runner OS: $RUNNER_OS"
          echo "Runner Architecture: $RUNNER_ARCH"
          echo "Node.js:"
          node --version
          echo "npm:"
          npm --version
          echo "Commit: $(git rev-parse HEAD)"

      - name: Install Dependencies
        run: npm ci

      - name: Testing
        run: npm run test:run

      - name: Build Demo
        run: npm run build:demo

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages Artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: demo/dist

  deploy:
    name: Deploy GitHub Pages
    runs-on: ubuntu-latest
    needs: testing
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 10

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
